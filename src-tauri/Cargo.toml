[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spinoml"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
portable-pty = "0.8"
# Pin: time >=0.3.47 has a HourBase impl that conflicts with cookie 0.18's
# blanket From<Into<Option<OffsetDateTime>>>. Downgrade resolves trait coherence.
time = "=0.3.46"

# Linux PR_SET_PDEATHSIG so spawned sidecars/tunnels die with the app even on
# a hard kill (dev restart / crash), preventing orphaned port holders.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
