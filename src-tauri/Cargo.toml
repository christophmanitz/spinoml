[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spinoml"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
portable-pty = "0.8"
# OS randomness for the per-launch sidecar authentication token (Phase 77).
# 0.3.x is already in the dependency closure via transitive deps; we only need
# the `getrandom::fill` entry point.
getrandom = "0.3"
# History: `time` was pinned to =0.3.46 because >=0.3.47 had a HourBase impl that
# conflicted with cookie 0.18's blanket From<Into<Option<OffsetDateTime>>>. That
# conflict no longer exists (0.3.55 builds with cookie 0.18.1, verified Phase 79) and
# the pin kept RUSTSEC-2026-0009 (stack-exhaustion DoS, patched >=0.3.47) in the tree.
time = "0.3"

# Linux PR_SET_PDEATHSIG so spawned sidecars/tunnels die with the app even on
# a hard kill (dev restart / crash), preventing orphaned port holders.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
